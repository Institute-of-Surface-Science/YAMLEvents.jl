name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} ${{ matrix.arch }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x86

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    env:
      BENCHMARK_DIR: ${{ runner.temp }}/yamlevents-benchmark
      JULIA_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64

      - uses: julia-actions/cache@v2

      # PkgBenchmark checks out the baseline, which can predate benchmark/.
      - name: Stage benchmark environment
        run: |
          mkdir -p "$BENCHMARK_DIR"
          cp benchmark/Project.toml benchmark/benchmarks.jl benchmark/runbenchmarks.jl "$BENCHMARK_DIR/"
          julia --color=yes --project="$BENCHMARK_DIR" -e 'using Pkg; Pkg.develop(Pkg.PackageSpec(path=ENV["GITHUB_WORKSPACE"])); Pkg.instantiate(); Pkg.precompile()'

      - name: Run benchmarks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            julia --color=yes --project="$BENCHMARK_DIR" "$BENCHMARK_DIR/runbenchmarks.jl" "$BASE_SHA"
          else
            julia --color=yes --project="$BENCHMARK_DIR" "$BENCHMARK_DIR/runbenchmarks.jl"
          fi
